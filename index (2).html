<p class="font-body-lg text-body-lg text-surface-cream opacity-90">Member Portal Access</p>
</div>

<h2 class="font-headline-md text-headline-md text-deep-forest mb-6">Welcome Back</h2>
<form action="#" class="space-y-6" method="POST">
<!-- Member ID / Email Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="member_id">Member ID / Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded bg-white text-text-charcoal focus:ring-2 focus:ring-deep-forest focus:border-deep-forest transition-colors font-body-md text-body-md" id="member_id" name="member_id" placeholder="Enter your ID or email" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded bg-white text-text-charcoal focus:ring-2 focus:ring-deep-forest focus:border-deep-forest transition-colors font-body-md text-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div class="mt-2 text-right">
<a class="font-label-sm text-label-sm text-earth-gold hover:text-deep-forest transition-colors" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded bg-deep-forest text-white font-label-lg text-label-lg hover:bg-opacity-90 hover:shadow-md transition-all transform hover:-translate-y-px" type="submit">
                        Sign In
                    </button>
</form>
<div class="mt-6">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-transparent text-on-surface-variant font-label-sm text-label-sm bg-white rounded-full">Or continue with</span>
</div>
</div>
